name: "MacOs tests env setup"
description: "Used to setup MacOS tests environment"
inputs:
  scala-version:
    description: "Scala version used in the tests"
    required: true
  java-version:
    description: "Java version to use in tests"
    default: "25"
  llvm-version:
    description: "LLVM version installed from Homebrew, the runner's preinstalled LLVM when empty"
    default: ""
  gc: 
    description: "Garbage collector used, might require installing dependencies"
runs:
  using: "composite"
  steps:
    - uses: coursier/cache-action@v8
    - uses: coursier/setup-action@v3
      # Installs sbt from the mirror, repo1 rate-limits parallel jobs
      env:
        COURSIER_REPOSITORIES: "https://maven-central.storage-download.googleapis.com/maven2"
      with:
        jvm: ${{inputs.java-version}}
        apps: sbt

    - name: Calculate binary version
      shell: bash
      run: |
        version=${{ inputs.scala-version }}
        if [[ $version == 2.* ]]; then
          echo "project-version=${version/./_}" >> $GITHUB_ENV
        else 
          echo "project-version=3" >> $GITHUB_ENV
        fi
    
    - name: Install dependencies
      shell: bash
      if: ${{ startsWith(inputs.gc, 'boehm') }}
      run: brew install bdw-gc

    - name: Install and cache LLVM toolchain
      if: ${{ inputs.llvm-version != '' }}
      uses: gerlero/brew-install@f21af2da1f07ad75501992d36996ddb7afe0cedb # v1.1.6
      with:
        # Homebrew ships LLD separately from LLVM
        packages: ${{ inputs.llvm-version == 'latest' && 'lld llvm' || format('lld llvm@{0}', inputs.llvm-version) }}

    # The runner's preinstalled llvm@<version> (without LLD) unless a version is requested
    - name: Expose LLVM toolchain
      shell: bash
      run: |
        version="${{ inputs.llvm-version }}"
        if [[ -z "$version" ]]; then
          version=$(ls -d "$(brew --prefix)"/opt/llvm@* 2>/dev/null | sed 's/.*@//' | sort -V | tail -1)
        fi
        if [[ -z "$version" || "$version" == "latest" ]]; then
          LLVM_TOOLCHAIN="$(brew --prefix llvm)/bin"
        else
          LLVM_TOOLCHAIN="$(brew --prefix llvm@$version)/bin"
        fi
        # Prefer Homebrew LLVM over Xcode clang (Discover uses LLVM_BIN / PATH).
        if [[ ! -d "$LLVM_TOOLCHAIN" ]]; then
          echo "::warning::No directory $LLVM_TOOLCHAIN; set LLVM_BIN on the step if needed."
          exit 0
        fi
        echo "LLVM_BIN=$LLVM_TOOLCHAIN" >> "$GITHUB_ENV"
        echo "$LLVM_TOOLCHAIN" >> "$GITHUB_PATH"
        echo "Using toolchain: $("$LLVM_TOOLCHAIN/clang" --version | head -1)"
        if [[ -n "${{ inputs.llvm-version }}" ]]; then
          LLD_TOOLCHAIN="$(brew --prefix lld)/bin"
          test -x "$LLD_TOOLCHAIN/ld64.lld"
          echo "Using linker: $("$LLD_TOOLCHAIN/ld64.lld" --version | head -1)"
        fi

    - uses: ./.github/actions/sbt-warmup
