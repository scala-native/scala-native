name: "MacOs tests env setup"
description: "Used to setup MacOS tests environment"
inputs:
  scala-version:
    description: "Scala version used in the tests"
    required: true
  java-version:
    description: "Java version to use in tests"
    default: "25"
  llvm-version:
    description: "Custom version of LLVM to use"
    default: "16"
  lld-version:
    description: "Version of the separate Homebrew LLD formula to use"
    default: ""
  gc: 
    description: "Garbage collector used, might require installing dependencies"
outputs:
  lld-path:
    description: "Absolute path to ld64.lld"
    value: ${{ steps.expose-llvm.outputs.lld-path }}
runs:
  using: "composite"
  steps:
    - uses: coursier/cache-action@v8
    - uses: coursier/setup-action@v3
      with:
        jvm: ${{inputs.java-version}}
        apps: sbt

    - name: Calculate binary version
      shell: bash
      run: |
        version=${{ inputs.scala-version }}
        if [[ $version == 2.* ]]; then
          echo "project-version=${version/./_}" >> $GITHUB_ENV
        elif [[ $version == "3-next" ]]; then
          echo "project-version=3_next" >> $GITHUB_ENV
        else 
          echo "project-version=3" >> $GITHUB_ENV
        fi
    
    - name: Install dependencies
      shell: bash
      if: ${{ startsWith(inputs.gc, 'boehm') }}
      run: brew install bdw-gc

    - name: Install and cache LLVM toolchain
      if: ${{ inputs.llvm-version != '' }}
      uses: gerlero/brew-install@b7bdd6875207fdf3b7ebd0ecc5cf8da6e657eca2 # v1.1.3
      with:
        # Homebrew ships LLD separately for newer versioned LLVM formulae.
        # A caller that needs LLD for ThinLTO can request an exact compatible
        # version instead of falling back to the unversioned (latest) formula.
        packages: ${{ inputs.llvm-version == 'latest' && 'lld llvm' || inputs.lld-version != '' && format('lld@{0} llvm@{1}', inputs.lld-version, inputs.llvm-version) || format('lld llvm@{0}', inputs.llvm-version) }}

    - name: Expose LLVM toolchain
      id: expose-llvm
      shell: bash
      if: ${{ inputs.llvm-version != '' }}
      run: |
        if [[ "${{ inputs.llvm-version }}" == "latest" ]]; then
          LLVM_TOOLCHAIN="$(brew --prefix llvm)/bin"
        else
          LLVM_TOOLCHAIN="$(brew --prefix llvm@${{ inputs.llvm-version }})/bin"
        fi
        if [[ -n "${{ inputs.lld-version }}" ]]; then
          LLD_TOOLCHAIN="$(brew --prefix lld@${{ inputs.lld-version }})/bin"
        else
          LLD_TOOLCHAIN="$(brew --prefix lld)/bin"
        fi
        # Prefer Homebrew LLVM over Xcode clang (Discover uses LLVM_BIN / PATH).
        if [[ -d "$LLVM_TOOLCHAIN" ]]; then
          echo "LLVM_BIN=$LLVM_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "$LLVM_TOOLCHAIN" >> "$GITHUB_PATH"
          echo "Using toolchain: $("$LLVM_TOOLCHAIN/clang" --version | head -1)"
          test -x "$LLD_TOOLCHAIN/ld64.lld"
          echo "lld-path=$LLD_TOOLCHAIN/ld64.lld" >> "$GITHUB_OUTPUT"
          echo "Using linker: $("$LLD_TOOLCHAIN/ld64.lld" --version | head -1)"
        else
          echo "::warning::No directory $LLVM_TOOLCHAIN; set LLVM_BIN on the step if needed."
        fi
