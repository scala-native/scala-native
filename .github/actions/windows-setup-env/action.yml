name: "Windows test env setup"
description: "Used to setup Windows tests environment"
inputs:
  scala-version:
    description: "Scala version used in the tests"
    required: true
  java-version:
    description: "Java version to use in tests"
    default: "25"
  llvm-version:
    description: "LLVM version to use"
    default: "20.1.4"
outputs:
  vcpkg-dir:
    description: "Directory containing installed libraries"
    value: ${{steps.resolve-env.outputs.VcpkgLibs}}
runs:
  using: "composite"
  steps:
    - uses: coursier/cache-action@v8
    - uses: coursier/setup-action@v3
      with:
        jvm: ${{inputs.java-version}}
        apps: sbt

    # On Windows all committed memory must fit in RAM plus the pagefile.
    # The default pagefile (about 3GB) is too small for the tests, mostly with None GC.
    - name: Configure Pagefile
      shell: powershell
      run: |
        & "${{ github.workspace }}/scripts/ci/windows/configure-pagefile.ps1" -MinimumSize 4GB -MaximumSize 12GB -DiskRoot 'C:'

    #Prepare environment, clang needs to be installed
    #Compilation on MSVC needs c++14 or higher and expects llvm 11.0.0 or newer
    #Cache commonly used files: Coursier, ivy cache
    - name: Resolve env variables
      id: resolve-env
      shell: pwsh
      run: |
        "LocalAppData=${env:LocalAppData}" >> $env:GITHUB_OUTPUT
        "UserProfile=${env:UserProfile}" >> $env:GITHUB_OUTPUT
        $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
        if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
          $vcpkgRoot = 'C:\vcpkg'
          Write-Warning "VCPKG_INSTALLATION_ROOT is unset or empty; using fallback: $vcpkgRoot"
        }
        $vcpkgLibs = "$vcpkgRoot\installed\x64-windows-static"
        "VcpkgLibs=$vcpkgLibs" >> $env:GITHUB_OUTPUT
        if ("${{inputs.scala-version}}".StartsWith("2.")) {
          echo ("project-version=" + ("${{inputs.scala-version}}".Split(".")[0, 1] -join "_")) >> $env:GITHUB_ENV
        } elseif ("${{inputs.scala-version}}".StartsWith("3-next")) {
          echo ("project-version=3_next") >> $env:GITHUB_ENV
        } else {
          echo "project-version=3" >> $env:GITHUB_ENV
        }

    - uses: ./.github/actions/windows-llvm-setup
      with:
        version: ${{ inputs.llvm-version }}
        architecture: x64

    - name: Exclude workspace from Windows Defender
      shell: pwsh
      run: |
        # Hypothesis: Defender real-time scanning may briefly lock jars/zips and cause
        # AccessDeniedException on sbt's atomic Files.move (ActionCache / packageBin).
        $paths = @(
          "${{ github.workspace }}",
          "$env:USERPROFILE\.sbt",
          "$env:USERPROFILE\.ivy2",
          "$env:LOCALAPPDATA\Coursier"
        )
        foreach ($p in $paths) {
          if ($p -and (Test-Path -LiteralPath $p)) {
            Add-MpPreference -ExclusionPath $p -ErrorAction SilentlyContinue
            Write-Host "Defender exclusion: $p"
          }
        }

    # Avoid background sbt server holding jar locks across workflow steps (AccessDenied on packageBin).
    - name: Disable sbt server autostart
      shell: pwsh
      run: |
        "SBT_OPTS=-Dsbt.server.autostart=false $($env:SBT_OPTS)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Assert clang installed and on path
      shell: pwsh
      run: clang --version

    - name: Install libs
      shell: pwsh
      run: vcpkg install bdwgc zlib --triplet=x64-windows-static

    # madler zlib 1.3+ CMake installs the static archive as zs.lib (OUTPUT_NAME
    # z + Windows static suffix s). javalib uses @link("zlib") -> zlib.lib.
    - name: Normalize vcpkg zlib.lib name for linking
      shell: pwsh
      run: |
        $libDir = Join-Path '${{ steps.resolve-env.outputs.VcpkgLibs }}' 'lib'
        $zs = Join-Path $libDir 'zs.lib'
        $zlib = Join-Path $libDir 'zlib.lib'
        if (-not (Test-Path -LiteralPath $zlib) -and (Test-Path -LiteralPath $zs)) {
          Copy-Item -LiteralPath $zs -Destination $zlib
          Write-Host "Installed zlib.lib (copy of zs.lib) for @link(zlib)"
        } elseif (Test-Path -LiteralPath $zlib) {
          Write-Host "zlib.lib already present"
        } else {
          Write-Error "Neither zlib.lib nor zs.lib in $libDir"
          exit 1
        }

    - name: Verify vcpkg static libs
      shell: pwsh
      run: |
        $zlib = Join-Path '${{ steps.resolve-env.outputs.VcpkgLibs }}' 'lib\zlib.lib'
        if (-not (Test-Path -LiteralPath $zlib)) {
          Write-Error "Missing '$zlib' (javalib links zlib.lib). VcpkgLibs='${{ steps.resolve-env.outputs.VcpkgLibs }}'"
          exit 1
        }
        Write-Host "OK: $zlib"
