name: "Windows on ARM test env setup"
description: "Set up the native Windows ARM64 toolchain and dependencies"
inputs:
  scala-version:
    description: "Scala version used in the tests"
    required: true
  java-version:
    description: "Java version to use in tests"
    default: "25"
  llvm-version:
    description: "LLVM release installed from llvm-project, the runner's preinstalled LLVM when empty"
    default: ""
runs:
  using: "composite"
  steps:
    # Use the runner's sbt installation with an ARM64 JDK.
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: microsoft
        java-version: ${{ inputs.java-version }}
        architecture: aarch64
        cache: sbt

    - name: Ensure sbt on PATH
      shell: pwsh
      run: |
        if (-not (Get-Command sbt -ErrorAction SilentlyContinue)) {
          $sbtBin = "${env:ProgramFiles(x86)}\sbt\bin"
          if (Test-Path -LiteralPath $sbtBin) {
            $sbtBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Error "sbt not found on PATH or under $sbtBin (expected on windows-11-arm image)"
            exit 1
          }
        }
        sbt --version

    - name: Configure Pagefile
      shell: pwsh
      run: |
        & "${{ github.workspace }}/scripts/ci/windows/configure-pagefile.ps1" -MinimumSize 4GB -MaximumSize 12GB -DiskRoot "C:"

    - name: Resolve env variables
      id: resolve-env
      shell: pwsh
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: arm64-windows
      run: |
        $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
        if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
          $vcpkgRoot = 'C:\vcpkg'
          Write-Warning "VCPKG_INSTALLATION_ROOT is unset or empty; using fallback: $vcpkgRoot"
        }
        $vcpkgLibs = "$vcpkgRoot\installed\arm64-windows-static"
        "VcpkgLibs=$vcpkgLibs" >> $env:GITHUB_OUTPUT
        if ("${{inputs.scala-version}}".StartsWith("2.")) {
          echo ("project-version=" + ("${{inputs.scala-version}}".Split(".")[0, 1] -join "_")) >> $env:GITHUB_ENV
        } else {
          echo "project-version=3" >> $env:GITHUB_ENV
        }

    - uses: ./.github/actions/windows-llvm-setup
      with:
        version: ${{ inputs.llvm-version }}
        architecture: arm64

    - name: Ensure MSVC ARM64 link libraries
      shell: pwsh
      run: |
        & "${{ github.workspace }}/scripts/ci/windows-arm/ensure-msvc-arm64-ci.ps1"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Install vcpkg libs (arm64-windows-static)
      shell: pwsh
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: arm64-windows
      run: vcpkg install bdwgc zlib --triplet=arm64-windows-static

    - name: Expose libraries to Scala Native builds
      shell: pwsh
      run: |
        & "${{ github.workspace }}/scripts/ci/windows/expose-vcpkg-libs.ps1" -VcpkgLibs '${{ steps.resolve-env.outputs.VcpkgLibs }}'

    - uses: ./.github/actions/sbt-warmup
