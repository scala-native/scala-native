name: "Restore build outputs"
description: "Enabled by repository variable CI_SHARE_BUILD_OUTPUTS=true. Download sbt compilation outputs produced by the Linux gate job of the same run, used only on Linux. Best effort: sbt compiles anything missing."
inputs:
  scala-version:
    description: "Scala binary version of the outputs"
    required: true
runs:
  using: "composite"
  steps:
    # scalacOptions contain the absolute workspace path, so Zinc recompiles
    # everything where it differs from the Linux gate's
    - name: Download build outputs
      id: download
      if: env.CI_SHARE_BUILD_OUTPUTS == 'true'
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: sbt-out-${{ inputs.scala-version }}
        path: ${{ runner.temp }}/sbt-out
    - name: Unpack build outputs
      if: steps.download.outcome == 'success'
      continue-on-error: true
      shell: bash
      run: |
        tar -I zstd -xf "$RUNNER_TEMP/sbt-out/sbt-out.tar.zst"
        # sbt rewrites generated sources
        chmod -R u+w target/out
        du -sh target/out/*
