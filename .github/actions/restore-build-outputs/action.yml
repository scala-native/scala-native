name: "Restore build outputs"
description: "Enabled unless repository variable CI_SHARE_BUILD_OUTPUTS=false. Download sbt compilation outputs produced by the Linux gate job of the same run. Best effort: sbt compiles anything missing."
inputs:
  scala-version:
    description: "Scala binary version of the outputs"
    required: true
runs:
  using: "composite"
  steps:
    # Outputs are machine independent: NIR does not depend on the target and
    # sbt stores paths relative to the build root
    - name: Download build outputs
      id: download
      if: env.CI_SHARE_BUILD_OUTPUTS == 'true'
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: sbt-out-${{ inputs.scala-version }}
        path: ${{ runner.temp }}/sbt-out
    - name: Unpack build outputs
      if: steps.download.outcome == 'success'
      continue-on-error: true
      shell: bash
      # Piped, tar -I differs between GNU tar and bsdtar
      run: |
        zstd -dc "$RUNNER_TEMP/sbt-out/sbt-out.tar.zst" | tar -xf -
        # sbt rewrites generated sources
        chmod -R u+w target/out
        du -sh target/out/*
