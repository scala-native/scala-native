name: Run tests BSD
# Called from ci.yml, see scripts/ci/plan.scala
on:
  workflow_call:
    inputs:
      # javalib: FreeBSD javalib suites only; base; extended adds NetBSD
      scope: { type: string, default: base }

permissions:
  contents: read

jobs:
  test-freebsd:
    name: Test ${{ inputs.scope == 'javalib' && 'javalib' || 'runtime' }} (FreeBSD x86_64, Scala 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Run tests on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.4"
          usesh: true
          mem: 12288
          prepare: |
            set -eu
            pkg update -f
            pkg install -y llvm18 boehm-gc-threaded git curl bash openjdk21
            curl -fL --retry 3 -o /tmp/sbt.tgz https://github.com/sbt/sbt/releases/download/v2.0.9/sbt-2.0.9.tgz
            tar -xzf /tmp/sbt.tgz -C /usr/local
          run: |
            set -eu
            export JAVA_HOME=/usr/local/openjdk21
            export LLVM_BIN=/usr/local/llvm18/bin
            export PATH="$JAVA_HOME/bin:$LLVM_BIN:/usr/local/sbt/bin:/usr/local/bin:$PATH"
            sh scripts/ci/bsd/run-bsd-tests.sh ${{ inputs.scope }}

  test-netbsd:
    name: Test runtime (NetBSD x86_64, Scala 3)
    if: inputs.scope == 'extended'
    # On ubuntu-24.04 the guest hangs at boot, after the action's retry it has no outbound network
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Run tests on NetBSD
        uses: vmactions/netbsd-vm@v1
        env:
          # Avoid stale or unresponsive fallback mirrors in the VM image,
          # keep a second live mirror for when the CDN answers 503.
          PKG_PATH: "https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/x86_64/10.0_2026Q3/All;http://ftp.fr.NetBSD.org/pub/pkgsrc/packages/NetBSD/x86_64/10.0_2026Q3/All"
        with:
          envs: PKG_PATH
          # scp avoids reinstalling the image's rsync through stale mirrors
          # before prepare has a chance to configure the package repository.
          sync: scp
          release: "10.1"
          usesh: true
          mem: 12288
          prepare: |
            set -eu
            export PATH="/usr/pkg/bin:/usr/pkg/sbin:$PATH"
            # Use base pkg_add with the repository passed through PKG_PATH.
            # Git needs a newer pcre2 than the cached VM image contains.
            # Package mirrors have transient outages
            retry() {
              for attempt in 1 2 3; do
                "$@" && return 0
                echo "Attempt $attempt failed: $*"
                sleep 30
              done
              return 1
            }
            retry /usr/sbin/pkg_add -u pcre2
            retry /usr/sbin/pkg_add clang boehm-gc zlib git curl bash openjdk21 mozilla-rootcerts
            curl -fL --retry 3 -o /tmp/sbt.tgz https://github.com/sbt/sbt/releases/download/v2.0.9/sbt-2.0.9.tgz
            tar -xzf /tmp/sbt.tgz -C /usr/pkg
          run: |
            set -eu
            export JAVA_HOME=/usr/pkg/java/openjdk21
            export PATH="$JAVA_HOME/bin:/usr/pkg/sbt/bin:/usr/pkg/bin:/usr/pkg/sbin:$PATH"
            export SCALANATIVE_INCLUDE_DIRS=/usr/pkg/include
            export SCALANATIVE_LIB_DIRS=/usr/pkg/lib
            # pkgsrc libraries also need to be visible to the runtime loader.
            export LD_LIBRARY_PATH="/usr/pkg/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            sh scripts/ci/bsd/run-bsd-tests.sh
