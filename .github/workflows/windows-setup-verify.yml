name: Verify Windows setup
on:
  pull_request:
    paths:
      - .github/actions/windows-setup-env/**
      - .github/actions/windows-arm-setup-env/**
      - .github/actions/windows-llvm-setup/**
      - .github/workflows/windows-setup-verify.yml
      - scripts/ci/windows/**
      - scripts/ci/windows-arm/**
  push:
    paths:
      - .github/actions/windows-setup-env/**
      - .github/actions/windows-arm-setup-env/**
      - .github/actions/windows-llvm-setup/**
      - .github/workflows/windows-setup-verify.yml
      - scripts/ci/windows/**
      - scripts/ci/windows-arm/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: Setup (${{ matrix.arch }}, LLVM ${{ matrix.llvm }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, arch: x64, llvm: "19.1.7" }
          - { os: windows-2022, arch: x64, llvm: "20.1.4" }
          - { os: windows-2022, arch: x64, llvm: "21.1.8" }
          - { os: windows-2022, arch: x64, llvm: "22.1.8" }
          - { os: windows-2022, arch: x64, llvm: "23.1.3" }
          - { os: windows-11-arm, arch: arm64, llvm: "22.1.8" }
    steps:
      - uses: actions/checkout@v7
      - name: Configure and verify pagefile
        shell: pwsh
        run: ./scripts/ci/windows/configure-pagefile.ps1
      - uses: ./.github/actions/windows-llvm-setup
        with:
          version: ${{ matrix.llvm }}
          architecture: ${{ matrix.arch }}
      - name: Verify a second install is a no-op
        shell: pwsh
        run: |
          $output = & ./scripts/ci/windows/install-llvm.ps1 -Version '${{ matrix.llvm }}' -Architecture '${{ matrix.arch }}' 6>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0 -or $output -notmatch 'already installed') {
            throw "Expected an existing installation to be reused"
          }
      - name: Ensure MSVC ARM64 link libraries
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: ./scripts/ci/windows-arm/ensure-msvc-arm64-ci.ps1
      - name: Verify environment and compile a program
        shell: pwsh
        run: |
          if ($env:LLVM_BIN -ne "$env:ProgramFiles\LLVM\bin") { throw "LLVM_BIN=$env:LLVM_BIN" }
          $expected = if ('${{ matrix.arch }}' -eq 'arm64') { 'aarch64' } else { 'x86_64' }
          $target = & clang -dumpmachine
          if ($LASTEXITCODE -ne 0 -or $target -notmatch "^$expected-.*windows-msvc") { throw "Unexpected clang target: $target" }
          $source = Join-Path $env:RUNNER_TEMP 'hello.c'
          $binary = Join-Path $env:RUNNER_TEMP 'hello.exe'
          Set-Content -LiteralPath $source -Value 'int main(void) { return 0; }'
          clang $source -o $binary
          if ($LASTEXITCODE -ne 0) { throw "clang failed" }
          & $binary
          if ($LASTEXITCODE -ne 0) { throw "hello.exe exited $LASTEXITCODE" }

  fault-injection:
    name: Download fault (${{ matrix.mode }})
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [recover, all-fail, bad-sha, unsupported]
    steps:
      - uses: actions/checkout@v7
      - name: Exercise installer failure handling
        shell: pwsh
        run: ./scripts/ci/windows/test-install-llvm.ps1 -Mode '${{ matrix.mode }}'
