name: Run tests older JDKs
# Called from ci.yml, see scripts/ci/plan.scala
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The JVM runs of the test suites check the tests themselves, the gates run
  # them only on the newest JDK
  tests-jvm:
    name: JVM tests (JDK ${{ matrix.java }}, Scala 3)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup-env
        with:
          scala-version: "3"
          java-version: ${{ matrix.java }}
          native-toolchain: false
      - name: Run JVM tests
        timeout-minutes: 45
        run: sbt "testsJVM3/test" "testsExtJVM3/test"
