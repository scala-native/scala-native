name: Run tests Windows
on:
  workflow_call:
  pull_request:
  schedule:
    # Every day at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
concurrency:
  group: windows-${{ github.head_ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test-runtime:
    name: Test runtime${{ matrix.os == 'windows-11-arm' && ' (Windows ARM64)' || '' }} (${{ matrix.scala }}, ${{ matrix.build-mode }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || ((github.event_name == 'schedule' || github.event_name == 'workflow_call') && github.repository == 'scala-native/scala-native')
    runs-on: ${{ matrix.os }}
    env:
      ENABLE_EXPERIMENTAL_COMPILER: true
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.os == 'windows-11-arm' && 'arm64-windows' || 'x64-windows' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        scala: [2.12, 2.13, 3]
        build-mode: [debug]
        include:
          - os: windows-2022
            scala: 3
            build-mode: release-fast
          - os: windows-11-arm
            scala: 3
            build-mode: debug
          - os: windows-11-arm
            scala: 3
            build-mode: release-fast
    steps:
      # Disable autocrlf setting, otherwise scalalib patches might not be possible to apply
      - name: Setup git config
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/windows-setup-env
        if: matrix.os == 'windows-2022'
        id: setup
        with:
          scala-version: ${{matrix.scala}}
      - uses: ./.github/actions/windows-arm-setup-env
        if: matrix.os == 'windows-11-arm'
        id: setup-arm
        with:
          scala-version: ${{ matrix.scala }}

      - name: Test GC
        timeout-minutes: 30
        env:
          SCALANATIVE_INCLUDE_DIRS: ${{ steps.setup.outputs.vcpkg-dir || steps.setup-arm.outputs.vcpkg-dir }}\include
          SCALANATIVE_LIB_DIRS: ${{ steps.setup.outputs.vcpkg-dir || steps.setup-arm.outputs.vcpkg-dir }}\lib
          SCALANATIVE_MODE: ${{ matrix.build-mode }}
        run: sbt "test-gc ${{ matrix.scala }}"
        shell: cmd

      # sbt 2 leaves a background server that can keep nscplugin.jar locked on Windows;
      - name: Shutdown sbt server
        if: always()
        continue-on-error: true
        run: sbt shutdown
        shell: cmd

      - name: Test runtime
        timeout-minutes: 45
        run: >
          set SCALANATIVE_GC=&
          set SCALANATIVE_MODE=${{ matrix.build-mode }}&
          set SCALANATIVE_INCLUDE_DIRS=${{ steps.setup.outputs.vcpkg-dir || steps.setup-arm.outputs.vcpkg-dir }}\include&
          set SCALANATIVE_LIB_DIRS=${{ steps.setup.outputs.vcpkg-dir || steps.setup-arm.outputs.vcpkg-dir }}\lib&
          set SCALANATIVE_TEST_PREFETCH_DEBUG_INFO=1&
          set SCALANATIVE &
          sbt
          "test-runtime ${{matrix.scala}}"
          "scalaPartestTests${{env.project-version}}/testOnly -- --showDiff neg/abstract.scala pos/abstract.scala run/Course-2002-01.scala"
        shell: cmd

  run-scripted-tests:
    name: Scripted tests
    if: github.event_name == 'pull_request' || ((github.event_name == 'schedule' || github.event_name == 'workflow_call') && github.repository == 'scala-native/scala-native')
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        scala: [2.12, 3]
    steps:
      # Disable autocrlf setting, otherwise scalalib patches might not be possible to apply
      - name: Setup git config
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/windows-setup-env
        id: setup
        with:
          scala-version: ${{matrix.scala}}

      - name: Test scripted
        env:
          SCALANATIVE_INCLUDE_DIRS: ${{steps.setup.outputs.vcpkg-dir}}\include
          SCALANATIVE_LIB_DIRS: ${{steps.setup.outputs.vcpkg-dir}}\lib
        # Run in the foreground without the boot server's Windows named pipe.
        run: sbt --server -Dsbt.server.autostart=false "test-scripted ${{matrix.scala}}"
        shell: cmd

  test-runtime-ext:
    name: Test runtime extension
    if: ((github.event_name == 'schedule' || github.event_name == 'workflow_call')  && github.repository == 'scala-native/scala-native') || (github.event_name == 'pull_request' && !contains(github.event.pull_request.body, '[skip ci]') && contains(github.event.pull_request.body, '[test-extended]'))
    runs-on: windows-2022
    env:
      ENABLE_EXPERIMENTAL_COMPILER: true
    needs: [test-runtime]
    strategy:
      fail-fast: false
      matrix:
        scala: [2.13, 3]
        build-mode: [debug, release-fast]
        lto: [none, thin]
        gc: [boehm, immix, commix]
        exclude:
          # Covered in basic test-runtime
          - scala: 3
            build-mode: debug
          - scala: 2.13
            build-mode: debug
            gc: immix
          - build-mode: release-fast
            lto: none
        include:
          - scala: 3
            build-mode: release-size
            lto: thin
            gc: immix
          # ReleaseFull is flaky
          # - scala: 3
          #   build-mode: release-full
          #   lto: thin
          #   gc: commix
    steps:
      # Disable autocrlf setting, otherwise scalalib patches might not be possible to apply
      - name: Setup git config
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/windows-setup-env
        id: setup
        with:
          scala-version: ${{matrix.scala}}

      - name: Run tests
        timeout-minutes: 45
        run: >
          set SCALANATIVE_GC=${{matrix.gc}}&
          set SCALANATIVE_MODE=${{matrix.build-mode}}&
          set SCALANATIVE_LTO=${{matrix.lto}}&
          set SCALANATIVE_INCLUDE_DIRS=${{steps.setup.outputs.vcpkg-dir}}\include&
          set SCALANATIVE_LIB_DIRS=${{steps.setup.outputs.vcpkg-dir}}\lib&
          set SCALANATIVE_TEST_PREFETCH_DEBUG_INFO=1&
          set SCALANATIVE_CI_NO_DEBUG_SYMBOLS=true&
          set SCALANATIVE &
          sbt "test-runtime ${{matrix.scala}}"
        shell: cmd

  test-llvm-versions:
    runs-on: windows-2022
    if: ((github.event_name == 'schedule' || github.event_name == 'workflow_call')  && github.repository == 'scala-native/scala-native') || (github.event_name == 'pull_request' && !contains(github.event.pull_request.body, '[skip ci]') && contains(github.event.pull_request.body, '[test-extended]'))
    # LLVM 21.1.8 crashes in clang codegen on Windows; keep for visibility.
    continue-on-error: ${{ matrix.llvm == '21.1.8' }}
    strategy:
      fail-fast: false
      matrix:
        scala: [3]
        # 20.x stays the default in windows-setup-env. Each version needs a
        # SHA-256 entry in scripts/ci/windows/install-llvm.ps1.
        llvm: ["19.1.7", "21.1.8", "22.1.8", "23.1.3"]
    steps:
      - name: Setup git config
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/windows-setup-env
        id: setup
        with:
          scala-version: ${{matrix.scala}}
          llvm-version: ${{ matrix.llvm }}

      - name: Run tests
        shell: cmd
        timeout-minutes: 45
        run: >
          set SCALANATIVE_INCLUDE_DIRS=${{steps.setup.outputs.vcpkg-dir}}\include&
          set SCALANATIVE_LIB_DIRS=${{steps.setup.outputs.vcpkg-dir}}\lib&
          set SCALANATIVE &
          sbt ";show tests3/nativeConfig;test-runtime ${{matrix.scala}}"
