name: Run tests Linux
# Called from ci.yml, see scripts/ci/plan.scala
on:
  workflow_call:
    inputs:
      extended: { type: boolean, default: false }

permissions:
  contents: read

env:
  CI_SHARE_BUILD_OUTPUTS: ${{ vars.CI_SHARE_BUILD_OUTPUTS != 'false' }}
  SCALANATIVE_TEST_PREFETCH_DEBUG_INFO: 1

jobs:
  # Native runtime tests, the gate runs all runtime tests in the default configuration
  runtime:
    name: Runtime ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64 (3)
            os: ubuntu-24.04
            scala: "3"
            mode: release-fast
            optimize: true
          - name: arm64 (3)
            os: ubuntu-24.04-arm
            scala: "3"
            mode: release-fast
            optimize: true
          - name: no-opt x64 (3)
            os: ubuntu-24.04
            scala: "3"
            mode: debug
            optimize: false
    steps: &runtime-steps
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup-env
        with:
          scala-version: ${{ matrix.scala }}
      - uses: ./.github/actions/restore-build-outputs
        with:
          scala-version: ${{ matrix.scala }}
      - name: Run tests
        timeout-minutes: 60
        env:
          SCALANATIVE_MODE: ${{ matrix.mode }}
          SCALANATIVE_GC: immix
          SCALANATIVE_OPTIMIZE: ${{ matrix.optimize }}
        run: sbt "test-runtime-native ${{ matrix.scala }}"

  runtime-extended:
    name: Runtime ${{ matrix.name }}
    if: inputs.extended
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64 (2.13)
            os: ubuntu-24.04
            scala: "2.13"
            mode: release-fast
            optimize: true
          - name: x64 (2.12)
            os: ubuntu-24.04
            scala: "2.12"
            mode: release-fast
            optimize: true
    steps: *runtime-steps

  runtime-ext:
    name: Runtime extension
    if: inputs.extended
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scala: ["2.13", "3"]
        build-mode: [debug, release-fast]
        lto: [none, thin]
        gc: [boehm, immix, commix]
        exclude:
          # Debug with immix is covered by the gate
          - scala: "3"
            build-mode: debug
          - scala: "2.13"
            build-mode: debug
            gc: immix
          # Slow, leads to timeouts
          - build-mode: release-fast
            lto: none
        include:
          - scala: "3"
            build-mode: release-size
            lto: thin
            gc: immix
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup-env
        with:
          scala-version: ${{ matrix.scala }}
      - uses: ./.github/actions/restore-build-outputs
        with:
          scala-version: ${{ matrix.scala }}
      - name: Run tests
        timeout-minutes: 60
        env:
          SCALANATIVE_MODE: ${{ matrix.build-mode }}
          SCALANATIVE_GC: ${{ matrix.gc }}
          SCALANATIVE_LTO: ${{ matrix.lto }}
          SCALANATIVE_OPTIMIZE: true
        run: sbt "test-runtime-native ${{ matrix.scala }}"

  llvm-versions:
    name: LLVM ${{ matrix.llvm }}
    if: inputs.extended
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # apt.llvm.org/llvm.sh accepts LLVM release numbers, not the "latest" alias.
        llvm: [17, 18, 19, 20, 21, 22] # Last 3 stable versions + available future versions
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup-env
        with:
          scala-version: "3"
          llvm-version: ${{ matrix.llvm }}
      - uses: ./.github/actions/restore-build-outputs
        with:
          scala-version: "3"
      - name: Run tests
        timeout-minutes: 60
        env:
          SCALANATIVE_MODE: release-fast
          SCALANATIVE_LTO: thin
        run: sbt "test-runtime-native 3"
