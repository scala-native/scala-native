# Publishes compiler plugins and scalalib of a release for a new Scala version.
# For 0.4.x use the workflow of the 0.4.x branch.
name: Publish for Scala release
run-name: Publish Scala Native ${{ inputs.scala-native-version }} for Scala ${{ inputs.scala-version }}
on:
  workflow_dispatch:
    inputs:
      scala-version:
        type: string
        description: "Version of Scala for which plugins and scalalib should be published"
        default: ""
      scala-native-version:
        type: string
        description: "Tag of Scala Native release which should be used for release"

permissions:
  contents: read

env:
  EXTRA_CROSS_SCALA_VERSION: "${{ inputs.scala-version }}"
  BACKPORT_RELEASE: 1

jobs:
  publish:
    name: Test and publish for Scala ${{ inputs.scala-version }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.scala-native-version }}
      - uses: ./.github/actions/linux-setup-env
        with:
          scala-version: ${{ inputs.scala-version }}
          java-version: 17
      - name: Resolve from Maven Central
        run: |
          echo "MAVEN_CENTRAL_MIRROR=" >> "$GITHUB_ENV"
          echo "COURSIER_REPOSITORIES=ivy2Local|central" >> "$GITHUB_ENV"

      - name: Test runtime
        run: sbt --server "++${{ inputs.scala-version }} -v" "nscplugin${{ env.project-version }}/test"
      - name: Setup PGP Key
        run: |
          echo -n "$PGP_SECRET" | base64 --decode | gpg --batch --import
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}

      - name: Publish release
        env:
          SONATYPE_USER: "${{ secrets.SONATYPE_USER }}"
          SONATYPE_PASSWORD: "${{ secrets.SONATYPE_PASSWORD }}"
          PGP_PASSPHRASE: "${{ secrets.PGP_PASSWORD }}"
        run: >
          sbt --server '
            ++${{ inputs.scala-version }} -v;
            nscplugin${{ env.project-version }}/publishSigned;
            junitPlugin${{ env.project-version }}/publishSigned;
            scalalib${{ env.project-version }}/publishSigned;
            scala3lib${{ env.project-version }}/publishSigned;
            sonaRelease;
          '
