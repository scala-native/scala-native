name: Publish
# Called from ci.yml for nightly snapshots and v0.5.* releases
on:
  workflow_call:
    inputs:
      snapshot: { type: boolean, required: true }

permissions:
  contents: read

env:
  # Last published commit, used by the nightly documentation
  LAST_PUBLISHED_TAG: last-published

jobs:
  # Other versions are compiled by the CI gate
  check-compiles:
    name: Test compilation with Scala 3 publish version
    if: github.repository == 'scala-native/scala-native'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup-env
        with:
          scala-version: "3"
          java-version: 17
          native-toolchain: false
      - name: Compile everything
        run: sbt "-J-Xmx7G" "compile-publish-version 3"

  publish:
    name: Publish ${{ matrix.scala }} ${{ matrix.part }}
    runs-on: ubuntu-24.04
    needs: [check-compiles]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scala: "2.12", part: "" }
          - { scala: "2.13", part: "" }
          - { scala: "3", part: "base" }
          - { scala: "3", part: "cross 3.1-3.3" }
          - { scala: "3", part: "cross 3.4-3.8" }
          - { scala: "3", part: "cross 3.9+" }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup-env
        with:
          scala-version: ${{ matrix.scala }}
          java-version: 17
          native-toolchain: false
      - name: Setup PGP Key
        run: |
          echo -n "$PGP_SECRET" | base64 --decode | gpg --batch --import
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}

      - name: Publish release
        env:
          SONATYPE_USER: "${{ secrets.SONATYPE_USER }}"
          SONATYPE_PASSWORD: "${{ secrets.SONATYPE_PASSWORD }}"
          PGP_PASSPHRASE: "${{ secrets.PGP_PASSWORD }}"
        run: sbt "-J-Xmx7G" "-J-XX:+UseG1GC" "publish-release-for-version ${{ matrix.scala }} ${{ matrix.part }}"

  # Snapshot version for the docs
  save_tag:
    name: Save SHA as last published tag
    runs-on: ubuntu-slim
    needs: [publish]
    if: inputs.snapshot
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${LAST_PUBLISHED_TAG} $GITHUB_SHA
          git push origin -f ${LAST_PUBLISHED_TAG}

  build_docs:
    name: Trigger documentation build
    runs-on: ubuntu-slim
    needs: [publish, save_tag]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.save_tag.result != 'failure' }}
    steps:
      - name: Trigger Read the Docs build
        shell: bash
        run: |
          curl -X POST \
            -H "Authorization: Token ${{ secrets.RTD_TOKEN }}" \
            https://app.readthedocs.org/api/v3/projects/scala-native/versions/latest/builds/

  dispatch:
    name: Dispatch trigger builds for dependant projects
    runs-on: ubuntu-24.04
    needs: [publish]
    if: inputs.snapshot
    strategy:
      matrix:
        repo: ['scala-native/scala-native-cli']
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
      - uses: coursier/setup-action@v3
        with:
          jvm: 25
          apps: sbt
      - name: Dispatch to workflows of dependant projects
        run: |
          set -euo pipefail
          publishedVersion=$(sbt --server --batch --color=never --supershell=never -error "print ThisBuild / version" | tail -n 1)
          echo "This build version: ${publishedVersion}"

          curl https://api.github.com/repos/${{ matrix.repo }}/dispatches \
            -H "Accept: application/vnd.github.everest-preview+json" \
            -H "Authorization: token ${{ secrets.DISPATCH_TOKEN }}" \
            --data "$(jq -n \
              --arg version "${publishedVersion}" \
              '{
                event_type: "nightly-published",
                client_payload: {
                  version: $version
                }
              }')"
