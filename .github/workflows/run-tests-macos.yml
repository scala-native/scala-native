name: Run tests MacOs
# Called from ci.yml, see scripts/ci/plan.scala
# Apple embedded targets (iOS, tvOS, watchOS) are tested in run-tests-apple.yml
on:
  workflow_call:
    inputs:
      extended: { type: boolean, default: false }

permissions:
  contents: read

env:
  CI_SHARE_BUILD_OUTPUTS: ${{ vars.CI_SHARE_BUILD_OUTPUTS != 'false' }}
  SCALANATIVE_TEST_PREFETCH_DEBUG_INFO: 1

jobs:
  # Native runtime tests in other configurations than the gate
  runtime:
    name: Runtime ${{ matrix.arch }} (${{ matrix.scala }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scala: "3"
            mode: release-fast
            arch: arm64
            runner: macos-26
          # The Intel gate runs debug, which uses conditional yieldpoints.
          # Release modes use trap-based yieldpoints, see #5393
          - scala: "3"
            mode: release-fast
            arch: x86_64
            runner: macos-26-intel
    steps: &runtime-steps
      - uses: actions/checkout@v7
      - uses: ./.github/actions/macos-setup-env
        with:
          scala-version: ${{ matrix.scala }}
      - uses: ./.github/actions/restore-build-outputs
        with:
          scala-version: ${{ matrix.scala }}
      - name: Run tests
        timeout-minutes: 60
        env:
          SCALANATIVE_MODE: ${{ matrix.mode }}
        run: sbt "test-runtime-native ${{ matrix.scala }}"

  runtime-extended:
    name: Runtime arm64 (${{ matrix.scala }}, ${{ matrix.mode }})
    if: inputs.extended
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - scala: "3"
            mode: debug
          - scala: "2.13"
            mode: debug
          - scala: "2.12"
            mode: debug
    steps: *runtime-steps

  runtime-ext:
    name: Runtime extension
    if: inputs.extended
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        scala: ["2.13", "3"]
        build-mode: [debug, release-fast]
        lto: [none, thin]
        gc: [boehm, immix, commix]
        exclude:
          # Covered by runtime-extended
          - scala: "3"
            build-mode: debug
          - lto: thin
            build-mode: debug
        include:
          - scala: "3"
            build-mode: release-size
            lto: thin
            gc: immix
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/macos-setup-env
        with:
          scala-version: ${{ matrix.scala }}
          gc: ${{ matrix.gc }}
      - uses: ./.github/actions/restore-build-outputs
        with:
          scala-version: ${{ matrix.scala }}
      - name: Run tests
        timeout-minutes: 60
        env:
          SCALANATIVE_MODE: ${{ matrix.build-mode }}
          SCALANATIVE_GC: ${{ matrix.gc }}
          SCALANATIVE_LTO: ${{ matrix.lto }}
          SCALANATIVE_OPTIMIZE: true
          # testsExt is not part of the macOS extension matrix
          TEST_COMMAND: >
            show tests${{ env.project-version }}/nativeConfig;
            sandbox${{ env.project-version }}/run;
            tests${{ env.project-version }}/test;
            junitTestOutputsNative${{ env.project-version }}/test;
            scalaPartestJunitTests${{ env.project-version }}/test
        run: sbt "${TEST_COMMAND}"

  llvm-versions:
    name: LLVM ${{ matrix.llvm }}
    if: inputs.extended
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        llvm: [17, 18, 19, 20, 21, latest] # Latest version == 22
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/macos-setup-env
        with:
          scala-version: "3"
          llvm-version: ${{ matrix.llvm }}
      - uses: ./.github/actions/restore-build-outputs
        with:
          scala-version: "3"
      - name: Run tests
        timeout-minutes: 60
        run: sbt "test-runtime-native 3"
